name: Generate Maroon Snake Animation

on:
  schedule: # runs automatically every 12 hours
    - cron: "0 */12 * * *" 
  workflow_dispatch: # allows you to run it manually
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # This generates both a light and dark mode SVG with your maroon theme!
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#000000&color_dots=#ebedf0,#93c5fd,#60a5fa,#3b82f6,#2563eb
            dist/github-contribution-grid-snake-dark.svg?bg_color=#0d1117&color_snake=#38bdf8&color_dots=#0d1117,#082f49,#0369a1,#0ea5e9,#38bdf8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
